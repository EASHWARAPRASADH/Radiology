[project]
name = "radio"
version = "0.1.0"
description = "Radio: radiologist-in-the-loop chest X-ray AI research prototype (not a medical device)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.3",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pydicom>=3.0",
    "highdicom>=0.23",
    "fhir.resources>=7.1",
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.14"]

[dependency-groups]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
radio = "radio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI/Typer parameter defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"src/radio/monitor.py" = ["E501"]  # embedded single-file HTML/JS dashboard
